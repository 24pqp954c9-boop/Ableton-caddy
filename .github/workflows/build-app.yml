name: Test and build Caddy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build-macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app and zip
        run: python make_app.py --zip
      - name: Check the zip unpacks to a launchable app
        run: |
          mkdir check && ditto -x -k AbletonCaddy-*.zip check
          test -x "check/AbletonCaddy.app/Contents/MacOS/AbletonCaddy"
          plutil -lint "check/AbletonCaddy.app/Contents/Info.plist"
          cmp index.html "check/AbletonCaddy.app/Contents/Resources/index.html"
          cmp caddy.py "check/AbletonCaddy.app/Contents/Resources/caddy.py"
      - uses: actions/upload-artifact@v4
        with:
          name: AbletonCaddy-macOS
          path: AbletonCaddy-*.zip
          if-no-files-found: error

  release:
    # Push a tag like v0.1.3 to publish a release with the verified zip attached.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AbletonCaddy-macOS
      - name: Check tag matches make_app.py VERSION
        run: |
          version="$(python3 -c 'import re;print(re.search(r"VERSION = \"(.+?)\"", open("make_app.py").read()).group(1))')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $version"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AbletonCaddy-*.zip \
            --title "$GITHUB_REF_NAME — Ableton Caddy for macOS" \
            --notes "Unzip and drag AbletonCaddy.app to Applications. Requires uv (https://docs.astral.sh/uv/). The app is unsigned: right-click → Open at Gatekeeper's first prompt. Windows: run \`uv run caddy.py\` from the source."
